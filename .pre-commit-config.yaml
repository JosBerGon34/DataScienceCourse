repos:
  - repo: local
    hooks:
      - id: nbconvert-md
        name: Generate Markdown in docs/Corrections
        entry: >
          bash -c '
            set -e
            mkdir -p docs/Corrections
            JUPYTER_BIN="./.venv-core/bin/jupyter"
            [ -x "$JUPYTER_BIN" ] || JUPYTER_BIN="jupyter"
            for nb in "$@"; do
              base=$(basename "$nb" .ipynb)
              "$JUPYTER_BIN" nbconvert --to markdown "$nb" --output-dir docs/Corrections/
              git add "docs/Corrections/${base}.md"
              if [ -d "docs/Corrections/${base}_files" ]; then
                git add "docs/Corrections/${base}_files"
              fi
            done
          ' --
        files: ^notebooks/.*\.ipynb$
        exclude: ^notebooks/00_template\.ipynb$
        language: system
        pass_filenames: true
