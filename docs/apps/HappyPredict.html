<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>HappyPredict — ESS Regression Viewer</title>
<style>
:root {
    --bg: #0f1117;
    --surface: #161b22;
    --border: #30363d;
    --text: #e6edf3;
    --muted: #8b949e;
    --accent: #58a6ff;
    --success: #3fb950;
    --warn: #d29922;
    --error: #f85149;
    --eastern: #f85149;
    --western: #3fb950;
    --northern: #58a6ff;
    --southern: #d29922;
}
* { box-sizing: border-box; margin: 0; padding: 0; }
body {
    font-family: 'Segoe UI', system-ui, sans-serif;
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
    padding: 2rem;
}
.container { max-width: 750px; margin: 0 auto; }
h1 { font-size: 1.4rem; margin-bottom: 0.3rem; }
.subtitle { color: var(--muted); font-size: 0.85rem; margin-bottom: 1.5rem; }

/* Badge */
.badge {
    display: inline-block;
    padding: 0.2rem 0.7rem;
    border-radius: 4px;
    font-size: 0.7rem;
    font-weight: 700;
    letter-spacing: 0.5px;
}
.badge-live { background: var(--success); color: #000; }
.badge-sim  { background: var(--warn); color: #000; }
.badge-err  { background: var(--error); color: #fff; }

/* Pizza */
.pizza-container {
    display: flex;
    justify-content: center;
    margin: 1.5rem 0 0.8rem 0;
}
.pizza-container svg { width: 280px; height: 280px; }
.pizza-container.disabled { opacity: 0.35; pointer-events: none; }
.slice { cursor: pointer; transition: opacity 0.2s, stroke-width 0.2s; }
.slice:hover { opacity: 1 !important; }
.slice.selected { stroke: #fff; stroke-width: 3; }
.cntry-label {
    text-align: center;
    font-size: 1rem;
    font-weight: 600;
    color: var(--accent);
    margin-bottom: 0.5rem;
}
.pizza-na {
    display: flex;
    justify-content: center;
    margin-bottom: 1.5rem;
    font-size: 0.78rem;
    color: var(--muted);
}
.pizza-na label {
    display: flex;
    align-items: center;
    gap: 0.4rem;
    cursor: pointer;
}
.pizza-na input[type="checkbox"] { accent-color: var(--warn); }

/* Feature rows */
.feature-block { margin-bottom: 1.2rem; }
.feature-row {
    display: grid;
    grid-template-columns: 140px 1fr 130px;
    align-items: center;
    gap: 0.8rem;
    margin-bottom: 0.4rem;
}
.feature-row label { font-size: 0.82rem; color: var(--muted); }
.feature-row input[type="range"] { width: 100%; accent-color: var(--accent); }
.feature-row input[type="number"] {
    width: 100%;
    background: var(--surface);
    border: 1px solid var(--border);
    color: var(--text);
    padding: 0.25rem 0.5rem;
    border-radius: 4px;
    font-size: 0.85rem;
}
.feature-row .val { font-size: 0.82rem; font-weight: 600; color: var(--accent); text-align: right; }

.slider-pair {
    display: grid;
    grid-template-columns: 1fr 62px;
    gap: 0.5rem;
    align-items: center;
}

/* Checkbox NA */
.na-row {
    display: grid;
    grid-template-columns: 140px 1fr 130px;
    gap: 0.8rem;
    margin-bottom: 1rem;
}
.na-row label {
    font-size: 0.75rem;
    color: var(--muted);
    display: flex;
    align-items: center;
    gap: 0.3rem;
    cursor: pointer;
}
.na-row input[type="checkbox"] { accent-color: var(--warn); }

/* Actions */
.actions { display: flex; gap: 1rem; margin: 1.5rem 0; }
button {
    padding: 0.6rem 1.5rem;
    border: none;
    border-radius: 6px;
    font-size: 0.9rem;
    font-weight: 600;
    cursor: pointer;
    transition: opacity 0.2s;
}
button:hover { opacity: 0.85; }
.btn-predict { background: var(--accent); color: #000; }
.btn-reset   { background: var(--surface); color: var(--text); border: 1px solid var(--border); }

/* Result */
.result-box {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 1.5rem;
    margin-top: 1rem;
    display: none;
}
.result-box.visible { display: block; }
.result-main { font-size: 2.5rem; font-weight: 700; color: var(--accent); }
.result-label { font-size: 0.9rem; color: var(--muted); margin-bottom: 1rem; }
.percentiles {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 0.6rem;
    font-size: 0.85rem;
}
.percentiles .p-label { color: var(--muted); }
.percentiles .p-val { color: var(--success); font-weight: 600; }

/* Error */
.error-box {
    background: rgba(248,81,73,0.1);
    border: 1px solid var(--error);
    border-radius: 6px;
    padding: 0.8rem;
    margin-top: 1rem;
    font-size: 0.82rem;
    display: none;
}
.error-box.visible { display: block; }
</style>
</head>
<body>
<div class="container">
    <h1>HappyPredict</h1>
    <p class="subtitle">ESS Regression Viewer — Module 10.1</p>
    <span id="badge" class="badge badge-err">CONNECTING...</span>

    <!-- Pizza -->
    <div class="pizza-container" id="pizza-container">
        <svg viewBox="0 0 300 300" id="pizza-svg"></svg>
    </div>
    <div class="cntry-label" id="cntry-label">Selecciona país</div>
    <div class="pizza-na">
        <label>
            <input type="checkbox" id="na_cntry" onchange="toggleCountryNA()">
            No responde país / región (Hot-Deck impute, n_resp +1)
        </label>
    </div>

    <!-- Features -->
    <div id="features"></div>

    <!-- Actions -->
    <div class="actions">
        <button class="btn-predict" onclick="runPrediction()">Predecir</button>
        <button class="btn-reset" onclick="resetAll()">Reset</button>
    </div>

    <!-- Result -->
    <div id="result" class="result-box">
        <div class="result-main" id="pred-val">--</div>
        <div class="result-label" id="pred-label">Happiness Score (0-10)</div>
        <div class="percentiles" id="percentiles"></div>
    </div>

    <!-- Error -->
    <div id="error" class="error-box"></div>
</div>

<script>
const API = "http://127.0.0.1:5000";
let selectedCntry = null;
let backendLive = false;

// Country data (aligned with CNTRYFC_MAP & REGIONFC_MAP)
const COUNTRIES = [
    {code:"HU", name:"Hungary",        fc:0,  region:"eastern",  rfc:0},
    {code:"IL", name:"Israel",         fc:1,  region:"eastern",  rfc:0},
    {code:"PL", name:"Poland",         fc:2,  region:"eastern",  rfc:0},
    {code:"SK", name:"Slovakia",       fc:3,  region:"eastern",  rfc:0},
    {code:"AT", name:"Austria",        fc:10, region:"western",  rfc:1},
    {code:"BE", name:"Belgium",        fc:11, region:"western",  rfc:1},
    {code:"CH", name:"Switzerland",    fc:12, region:"western",  rfc:1},
    {code:"DE", name:"Germany",        fc:13, region:"western",  rfc:1},
    {code:"FR", name:"France",         fc:14, region:"western",  rfc:1},
    {code:"GB", name:"United Kingdom", fc:15, region:"western",  rfc:1},
    {code:"IE", name:"Ireland",        fc:16, region:"western",  rfc:1},
    {code:"NL", name:"Netherlands",    fc:17, region:"western",  rfc:1},
    {code:"EE", name:"Estonia",        fc:20, region:"northern", rfc:2},
    {code:"FI", name:"Finland",        fc:21, region:"northern", rfc:2},
    {code:"NO", name:"Norway",         fc:22, region:"northern", rfc:2},
    {code:"SE", name:"Sweden",         fc:23, region:"northern", rfc:2},
    {code:"ES", name:"Spain",          fc:30, region:"southern", rfc:3},
    {code:"GR", name:"Greece",         fc:31, region:"southern", rfc:3},
    {code:"HR", name:"Croatia",        fc:32, region:"southern", rfc:3},
    {code:"IT", name:"Italy",          fc:33, region:"southern", rfc:3},
    {code:"PT", name:"Portugal",       fc:34, region:"southern", rfc:3},
    {code:"RS", name:"Serbia",         fc:35, region:"southern", rfc:3},
    {code:"SI", name:"Slovenia",       fc:36, region:"southern", rfc:3},
    {code:"BG", name:"Bulgaria",       fc:37, region:"southern", rfc:3},
];

const REGION_COLORS = { eastern:"#f85149", western:"#3fb950", northern:"#58a6ff", southern:"#d29922" };

// Feature metadata
const FEATURES = [
    {name:"lrscale", label:"Left-Right Scale",   type:"slider", min:0, max:10, step:0.1, def:5.0},
    {name:"rlgdgr",  label:"Religiosity",        type:"slider", min:0, max:10, step:0.1, def:3.0},
    {name:"agea",    label:"Age (0–99)",         type:"number", min:0, max:99, step:1,   def:40},
    {name:"hhmmb",   label:"Household (0–99)",   type:"number", min:0, max:99, step:1,   def:2},
    {name:"gndr",    label:"Gender (2 pos)",     type:"discrete_slider", min:1, max:2, step:1, def:1,
        labels:{1:"1: Male", 2:"2: Female"}},
    {name:"mnactic", label:"Main Activity (9)",  type:"discrete_slider", min:1, max:9, step:1, def:1,
        labels:{
            1:"1: Paid work", 2:"2: Education", 3:"3: Unemployed (seeking)",
            4:"4: Unemployed (not seeking)", 5:"5: Sick/Disabled", 6:"6: Retired",
            7:"7: Military/Community", 8:"8: Housework", 9:"9: Other"
        }},
];

// --- Pizza rendering ---
function renderPizza() {
    const svg = document.getElementById("pizza-svg");
    const cx=150, cy=150, r=130, ir=45;
    const n = COUNTRIES.length;
    const angle = (2*Math.PI)/n;

    COUNTRIES.forEach((c, i) => {
        const a1 = i*angle - Math.PI/2;
        const a2 = a1 + angle;
        const x1=cx+ir*Math.cos(a1), y1=cy+ir*Math.sin(a1);
        const x2=cx+r*Math.cos(a1),  y2=cy+r*Math.sin(a1);
        const x3=cx+r*Math.cos(a2),  y3=cy+r*Math.sin(a2);
        const x4=cx+ir*Math.cos(a2), y4=cy+ir*Math.sin(a2);

        const path = document.createElementNS("http://www.w3.org/2000/svg","path");
        path.setAttribute("d",`M${x1} ${y1}L${x2} ${y2}A${r} ${r} 0 0 1 ${x3} ${y3}L${x4} ${y4}A${ir} ${ir} 0 0 0 ${x1} ${y1}Z`);
        path.setAttribute("fill", REGION_COLORS[c.region]);
        path.setAttribute("stroke","#0f1117");
        path.setAttribute("stroke-width","1");
        path.setAttribute("opacity","0.7");
        path.setAttribute("class","slice");
        path.innerHTML = `<title>${c.name} (${c.code}) — fc:${c.fc}, rfc:${c.rfc}</title>`;
        path.addEventListener("click", ()=> selectCountry(c, path));
        path.addEventListener("mouseenter", ()=> path.setAttribute("opacity","1"));
        path.addEventListener("mouseleave", ()=> { if(!path.classList.contains("selected")) path.setAttribute("opacity","0.7"); });
        svg.appendChild(path);

        const mid = a1 + angle/2;
        const lr = (r+ir)/2 + 12;
        const t = document.createElementNS("http://www.w3.org/2000/svg","text");
        t.setAttribute("x", cx+lr*Math.cos(mid));
        t.setAttribute("y", cy+lr*Math.sin(mid));
        t.setAttribute("text-anchor","middle");
        t.setAttribute("dominant-baseline","middle");
        t.setAttribute("fill","#fff");
        t.setAttribute("font-size","9");
        t.setAttribute("font-weight","600");
        t.setAttribute("pointer-events","none");
        t.textContent = c.code;
        svg.appendChild(t);
    });
}

function selectCountry(c, path) {
    document.querySelectorAll(".slice").forEach(s => { s.classList.remove("selected"); s.setAttribute("opacity","0.7"); });
    path.classList.add("selected");
    path.setAttribute("opacity","1");
    selectedCntry = c;
    document.getElementById("cntry-label").textContent = `${c.name} [${c.code}] (${c.region} | fc=${c.fc}, rfc=${c.rfc})`;
}

function toggleCountryNA() {
    const na = document.getElementById("na_cntry").checked;
    const pizzaBox = document.getElementById("pizza-container");
    pizzaBox.classList.toggle("disabled", na);
    if (na) {
        selectedCntry = null;
        document.querySelectorAll(".slice").forEach(s => { s.classList.remove("selected"); s.setAttribute("opacity","0.7"); });
        document.getElementById("cntry-label").textContent = "N/A (Hot-Deck impute cntryfc & regionfc)";
    } else {
        document.getElementById("cntry-label").textContent = "Selecciona país";
    }
}

// --- Render features ---
function renderFeatures() {
    const container = document.getElementById("features");
    container.innerHTML = FEATURES.map(f => {
        let control = "";
        let valText = f.def;

        if (f.type === "slider") {
            control = `<div class="slider-pair">
                <input type="range" id="slider_${f.name}" min="${f.min}" max="${f.max}" step="${f.step}" value="${f.def}"
                    oninput="syncVal('${f.name}', this.value)">
                <input type="number" id="input_${f.name}" min="${f.min}" max="${f.max}" step="${f.step}" value="${f.def}"
                    oninput="syncSlider('${f.name}', this.value)">
            </div>`;
        } else if (f.type === "number") {
            control = `<input type="number" id="input_${f.name}" min="0" max="99" step="1" maxlength="2" value="${f.def}"
                oninput="sanitizeTwoDigitInt('${f.name}', this)">`;
        } else if (f.type === "discrete_slider") {
            valText = f.labels[f.def];
            control = `<input type="range" id="slider_${f.name}" min="${f.min}" max="${f.max}" step="1" value="${f.def}"
                oninput="syncDiscrete('${f.name}', this.value)">`;
        }

        return `
        <div class="feature-block">
            <div class="feature-row">
                <label>${f.label}</label>
                ${control}
                <span class="val" id="val_${f.name}">${valText}</span>
            </div>
            <div class="na-row">
                <span></span>
                <label><input type="checkbox" id="na_${f.name}" onchange="toggleNA('${f.name}')"> No responde</label>
                <span></span>
            </div>
        </div>`;
    }).join("");
}

function sanitizeTwoDigitInt(name, el) {
    let raw = el.value.replace(/[^0-9]/g, "");
    if (raw.length > 2) raw = raw.slice(0, 2);
    const num = raw === "" ? 0 : Math.min(99, Math.max(0, parseInt(raw, 10)));
    el.value = raw === "" ? "" : num;
    document.getElementById(`val_${name}`).textContent = num;
}

function syncDiscrete(name, v) {
    const f = FEATURES.find(item => item.name === name);
    const val = document.getElementById(`val_${name}`);
    if (val && f && f.labels) val.textContent = f.labels[parseInt(v, 10)];
}

function syncVal(name, v) {
    const s = document.getElementById(`slider_${name}`);
    const i = document.getElementById(`input_${name}`);
    const val = document.getElementById(`val_${name}`);
    if (s) s.value = v;
    if (i) i.value = v;
    if (val) val.textContent = v;
}

function syncSlider(name, v) {
    const s = document.getElementById(`slider_${name}`);
    const val = document.getElementById(`val_${name}`);
    if (s) s.value = v;
    if (val) val.textContent = v;
}

function toggleNA(name) {
    const na = document.getElementById(`na_${name}`).checked;
    const f = FEATURES.find(item => item.name === name);
    const s = document.getElementById(`slider_${name}`);
    const i = document.getElementById(`input_${name}`);
    const val = document.getElementById(`val_${name}`);
    if (s) s.disabled = na;
    if (i) i.disabled = na;
    if (val) {
        if (na) {
            val.textContent = "N/A";
        } else if (f.type === "discrete_slider") {
            val.textContent = f.labels[parseInt(s.value, 10)];
        } else {
            val.textContent = i.value;
        }
    }
}

function resetAll() {
    FEATURES.forEach(f => {
        const s = document.getElementById(`slider_${f.name}`);
        const i = document.getElementById(`input_${f.name}`);
        const val = document.getElementById(`val_${f.name}`);
        const na = document.getElementById(`na_${f.name}`);
        if (s) { s.value = f.def; s.disabled = false; }
        if (i) { i.value = f.def; i.disabled = false; }
        if (val) val.textContent = f.type === "discrete_slider" ? f.labels[f.def] : f.def;
        if (na) na.checked = false;
    });
    document.getElementById("na_cntry").checked = false;
    document.getElementById("pizza-container").classList.remove("disabled");
    selectedCntry = null;
    document.querySelectorAll(".slice").forEach(s => { s.classList.remove("selected"); s.setAttribute("opacity","0.7"); });
    document.getElementById("cntry-label").textContent = "Selecciona país";
    document.getElementById("result").classList.remove("visible");
    document.getElementById("error").classList.remove("visible");
}

// --- Get features payload ---
function getPayload() {
    const payload = {};
    const naCntry = document.getElementById("na_cntry").checked;

    if (selectedCntry && !naCntry) {
        payload["cntry"] = selectedCntry.code;
        payload["cntryfc"] = selectedCntry.fc;
        payload["regionfc"] = selectedCntry.rfc;
    } else {
        payload["cntry"] = null;
        payload["cntryfc"] = null;
        payload["regionfc"] = null;
    }

    FEATURES.forEach(f => {
        const na = document.getElementById(`na_${f.name}`).checked;
        if (na) {
            payload[f.name] = null;
        } else if (f.type === "discrete_slider") {
            payload[f.name] = parseInt(document.getElementById(`slider_${f.name}`).value, 10);
        } else if (f.type === "number") {
            const raw = document.getElementById(`input_${f.name}`).value;
            payload[f.name] = raw === "" ? 0 : parseInt(raw, 10);
        } else {
            payload[f.name] = parseFloat(document.getElementById(`input_${f.name}`).value);
        }
    });

    return payload;
}

// --- Prediction ---
async function runPrediction() {
    const payload = getPayload();
    const resultBox = document.getElementById("result");
    const errorBox = document.getElementById("error");
    const naCntry = document.getElementById("na_cntry").checked;
    resultBox.classList.remove("visible");
    errorBox.classList.remove("visible");

    if (!selectedCntry && !naCntry) {
        showError("Selecciona un país en la pizza o marca 'No responde país / región'.");
        return;
    }

    try {
        const res = await fetch(`${API}/predict`, {
            method: "POST",
            headers: {"Content-Type": "application/json"},
            body: JSON.stringify(payload),
        });
        const data = await res.json();

        if (res.status === 400) {
            showError(data.error + (data.missing ? `: ${data.missing.join(", ")}` : ""));
            return;
        }
        if (!res.ok) throw new Error(data.error || "Server error");

        setBadge("LIVE BACKEND", "badge-live");
        showResult(data);
    } catch (e) {
        setBadge("SIMULATION MODE", "badge-sim");
        showResult(simulate(payload));
    }
}

function simulate(payload) {
    // Fallback heuristic (transparent)
    let score = 7.4;
    if (payload.lrscale != null) score += (payload.lrscale - 5) * 0.05;
    if (payload.rlgdgr != null)  score += (payload.rlgdgr - 5) * 0.04;
    if (payload.mnactic === 5)   score -= 1.1;
    if (payload.regionfc === 2)  score += 0.5;
    if (payload.regionfc === 0)  score -= 0.4;

    const clamped = Math.max(0.0, Math.min(10.0, score));
    const nResp = Object.entries(payload)
        .filter(([k, v]) => k !== "cntry" && v === null).length;

    return {
        prediction: Number(clamped.toFixed(1)),
        percentile_global:   Math.min(99, Math.max(1, Math.round(clamped * 9.5))),
        percentile_region:   Math.min(99, Math.max(1, Math.round(clamped * 9.2))),
        percentile_country:  Math.min(99, Math.max(1, Math.round(clamped * 9.0))),
        percentile_multivar: Math.min(99, Math.max(1, Math.round(clamped * 9.4))),
        n_resp: nResp
    };
}

function showResult(data) {
    document.getElementById("pred-val").textContent = Number(data.prediction).toFixed(1);
    document.getElementById("pred-label").textContent = `Índice de Bienestar Estimado (0-10) • Respuestas omitidas: ${data.n_resp}`;
    document.getElementById("percentiles").innerHTML = `
        <div><span class="p-label">Más feliz que el:</span> <span class="p-val">${data.percentile_global}% de toda Europa</span></div>
        <div><span class="p-label">Más feliz que el:</span> <span class="p-val">${data.percentile_region}% de su macro-región</span></div>
        <div><span class="p-label">Más feliz que el:</span> <span class="p-val">${data.percentile_country}% de su país</span></div>
        <div><span class="p-label">Más feliz que el:</span> <span class="p-val">${data.percentile_multivar}% de perfiles similares (KNN)</span></div>
    `;
    document.getElementById("result").classList.add("visible");
}

function showError(msg) {
    const box = document.getElementById("error");
    box.textContent = msg;
    box.classList.add("visible");
}

function setBadge(text, cls) {
    const b = document.getElementById("badge");
    b.textContent = text;
    b.className = `badge ${cls}`;
}

async function checkHealth() {
    try {
        const res = await fetch(`${API}/health`);
        if (res.ok) {
            backendLive = true;
            setBadge("LIVE BACKEND", "badge-live");
            return;
        }
    } catch (_) {}
    backendLive = false;
    setBadge("SIMULATION MODE", "badge-sim");
}

// Init
renderPizza();
renderFeatures();
checkHealth();
</script>
</body>
</html>
